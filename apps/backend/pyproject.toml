[project]
name = "huce-kms-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hoangcutedz", email = "hoangn2422@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.12.0",
    "fastapi[standard]>=0.162.2",
    "google-genai>=3.0.0",
    "lxml>=5.2.0",
    "markdownify>=0.14.0",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.9.0",
    "pymupdf>=2.1",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "trafilatura>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
module-root = "src"
