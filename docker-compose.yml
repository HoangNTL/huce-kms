services:
  # PostgreSQL 16 (Relational Database)
  postgres:
    image: postgres:16-alpine
    container_name: huce-kms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-huce_kms}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-huce_kms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - huce-kms-network

  # Qdrant Vector Database (Vector Search Engine)
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: huce-kms-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "${QDRANT_PORT:-6333}:6333" # REST API & Web UI Dashboard (http://localhost:6333/dashboard)
      - "${QDRANT_GRPC_PORT:-6334}:6334" # High-performance gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - huce-kms-network

# Persistent Volumes
volumes:
  postgres_data:
    name: huce-kms-postgres-data
  qdrant_data:
    name: huce-kms-qdrant-data

# Isolated Bridge Network
networks:
  huce-kms-network:
    name: huce-kms-network
    driver: bridge
